site_name: wawoo-skills
site_url: https://skills.wawoo.jp/
site_description: >-
  按设计调用 — 面向 AI 编码 agent 的可复用 skill / agent / workflow / MCP 套件。
repo_url: https://github.com/parkwoo/wawoo-agent-skills
repo_name: parkwoo/wawoo-agent-skills
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site/docs

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  logo: assets/wawoo-skills-logo.png
  favicon: assets/wawoo-skills-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: 配色
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/material-kit.css

extra_javascript:
  - javascripts/kit-lang-menu.js
  - javascripts/kit-doc-layout.js
  - javascripts/kit-doc-toc.js
  - javascripts/kit-doc-client-nav.js

extra:
  homepage: /

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 2-3
      title: 目录

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          nav_translations:
            使用说明: 使用说明
            Skill 收录: Skill 收录
            更新日志: 更新日志
        - locale: en
          name: English
          nav_translations:
            使用说明: Manual
            Skill 收录: Skills catalog
            更新日志: Changelog
        - locale: ja
          name: 日本語
          nav_translations:
            使用说明: 利用ガイド
            Skill 收录: Skill 収録
            更新日志: 変更履歴
        - locale: ko
          name: 한국어
          nav_translations:
            使用说明: 사용 설명
            Skill 收录: Skill 수록
            更新日志: 변경 기록
  - include-markdown

validation:
  links:
    not_found: ignore
    absolute_links: ignore

exclude_docs: |
  memory/
  plans/
  getting-started/
  install/
  mcp/
  workflows/
  faq/
  evidence/
  PRODUCT-OVERVIEW*
  CLIENT-INTEGRATION-GUIDE*
  COPY-MARKETING-GUIDE*
  GUIDES*
  INTENT-ROUTING*
  MEMORY-CLIENT-GUIDE*
  SEO-KEYWORDS*
  SKILL-UPLIFT-PILOT*
  VERSIONING*

nav:
  - 使用说明: usage.md
  - 免费下载: download.md
  - 攻略: guides.md
  - Skill 收录: skills-catalog.md
  - 更新日志: changelog.md