name: Bug report
description: Report a reproducible problem with the kit
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: Output of `cat VERSION`
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Claude Code
        - Codex
        - Cursor
        - Kilo
        - OpenCode
        - Paseo
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or attach screenshots. Remove secrets and personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `python3 scripts/validate_assets.py` and included the result.
        - label: I removed secrets and personal data from logs.
