name: publish-public

# Publishes ONLY the allowlisted subset (.publish-allowlist) to the public repo
# parkwoo/wawoo-skills. Runs on release tags (keeps private-repo CI minutes minimal).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard allowlist (never publish internal paths)
        run: |
          test -s .publish-allowlist
          ! grep -E '^(internal/|\.publish-allowlist)' .publish-allowlist

      - name: Filter to the public subset
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-filter-repo
          git clone --no-local . /tmp/out
          cd /tmp/out
          git filter-repo --force --paths-from-file "$GITHUB_WORKSPACE/.publish-allowlist"

      - name: Push to the public repo (SSH deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_publish
          chmod 600 ~/.ssh/id_publish
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd /tmp/out
          git remote add pub git@github.com:parkwoo/wawoo-skills.git
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_publish -o IdentitiesOnly=yes"
          git push --force pub 'refs/heads/*:refs/heads/*'
          git push --force pub --tags
