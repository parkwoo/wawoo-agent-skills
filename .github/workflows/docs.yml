name: docs

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.eleventy.cjs'
      - 'eleventy/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'website/**'
      - 'scripts/build_kit_site.sh'
      - 'scripts/eleventy_*'
      - 'scripts/docs_*.sh'
      - 'scripts/kit_*.sh'
      - 'scripts/gen_site_capabilities_json.py'
      - 'scripts/gen_catalog_skill_buckets.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build kit site (Eleventy + marketing)
        env:
          KIT_BUCKETS_LENIENT: "1"
        run: bash scripts/build_kit_site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4